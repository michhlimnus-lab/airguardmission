<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirGuard Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // ========================================================
        // 🚨 IMPORTANT: REPLACE THESE WITH YOUR FIREBASE KEYS 🚨
        // ========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDRO8liDHigDRzV0jpHn3c4SmDlC-l3qLc",
            authDomain: "your-project-id.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };
        
        let db, auth;
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (e) {
            console.error("Firebase Initialization Error. Please check your config keys.", e);
        }

        const { useState, useEffect, useMemo } = React;
        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        function App() {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [studentName, setStudentName] = useState('');
            const [classCode, setClassCode] = useState('');
            const [showTeacherView, setShowTeacherView] = useState(false);
            const [user, setUser] = useState(null);
            const [completedModules, setCompletedModules] = useState({ mod1: false, mod2: false, mod3: false, mod4: false });

            useEffect(() => {
                if (!auth) return;
                auth.signInAnonymously().catch(e => console.error("Auth Error", e));
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            const submitResponse = async (moduleTitle, text) => {
                if (!studentName || !classCode || !db || !user) return;
                const safeClassCode = classCode.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
                try {
                    await db.collection(`airGuardResponses_${safeClassCode}`).add({
                        studentName,
                        phase: moduleTitle,
                        text,
                        timestamp: Date.now(),
                        userId: user.uid
                    });
                } catch (e) { console.error("Submit error", e); }
            };

            const markCompleted = (mod) => {
                setCompletedModules(prev => ({ ...prev, [mod]: true }));
                setTimeout(() => setCurrentScreen('dashboard'), 1500);
            };

            const getProgress = () => Object.values(completedModules).filter(Boolean).length;

            if (showTeacherView) return <TeacherDashboard onClose={() => setShowTeacherView(false)} db={db} />;

            const renderScreen = () => {
                switch (currentScreen) {
                    case 'home': return <Home onStart={() => setCurrentScreen('dashboard')} studentName={studentName} setStudentName={setStudentName} classCode={classCode} setClassCode={setClassCode} />;
                    case 'dashboard': return <Dashboard completedModules={completedModules} onSelect={setCurrentScreen} progress={getProgress()} />;
                    case 'mod1': return <Module1 onComplete={() => markCompleted('mod1')} onBack={() => setCurrentScreen('dashboard')} submitResponse={submitResponse} />;
                    case 'mod2': return <Module2 onComplete={() => markCompleted('mod2')} onBack={() => setCurrentScreen('dashboard')} submitResponse={submitResponse} />;
                    case 'mod3': return <Module3 onComplete={() => markCompleted('mod3')} onBack={() => setCurrentScreen('dashboard')} submitResponse={submitResponse} />;
                    case 'mod4': return <Module4 onComplete={() => markCompleted('mod4')} onBack={() => setCurrentScreen('dashboard')} submitResponse={submitResponse} />;
                }
            };

            return (
                <div className="min-h-screen p-4 md:p-6">
                    <header className="max-w-4xl mx-auto flex items-center justify-between pb-6 border-b border-slate-700 mb-6">
                        <div className="flex items-center gap-3">
                            <div className="bg-cyan-500 p-2 rounded-lg text-slate-900"><Icon name="shield" className="w-6 h-6" /></div>
                            <div>
                                <h1 className="text-xl font-bold tracking-wider">AIRGUARD</h1>
                                <p className="text-xs text-cyan-400 font-mono">MISSION CONTROL</p>
                            </div>
                        </div>
                        <button onClick={() => setShowTeacherView(true)} className="text-slate-500 hover:text-cyan-400"><Icon name="eye" className="w-5 h-5" /></button>
                    </header>
                    <main className="max-w-4xl mx-auto">{renderScreen()}</main>
                </div>
            );
        }

        function TeacherDashboard({ onClose, db }) {
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [pin, setPin] = useState("");
            const [classCode, setClassCode] = useState("");
            const [responses, setResponses] = useState([]);

            useEffect(() => {
                if (isUnlocked && classCode && db) {
                    const safeClassCode = classCode.toUpperCase().replace(/[^A-Z0-9]/g, '');
                    return db.collection(`airGuardResponses_${safeClassCode}`).onSnapshot(s => {
                        setResponses(s.docs.map(d => d.data()));
                    });
                }
            }, [isUnlocked, classCode, db]);

            const analysis = useMemo(() => {
                const data = {};
                responses.forEach(r => {
                    if (!data[r.studentName]) data[r.studentName] = { success: 0, fail: 0 };
                    if (r.text.includes("SUCCESS")) data[r.studentName].success += 1;
                    else if (r.text.includes("FAILED")) data[r.studentName].fail += 1;
                });
                return data;
            }, [responses]);

            if (!isUnlocked) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen space-y-4">
                        <h2 className="text-2xl font-bold mb-4">Teacher Vault Access</h2>
                        <input className="p-3 rounded bg-slate-800 text-white w-64 border border-slate-600" placeholder="Class Code" onChange={e => setClassCode(e.target.value)} />
                        <input className="p-3 rounded bg-slate-800 text-white w-64 border border-slate-600" type="password" placeholder="PIN (8600)" onChange={e => setPin(e.target.value)} />
                        <button onClick={() => pin === "8600" && setIsUnlocked(true)} className="bg-cyan-600 px-6 py-2 rounded font-bold w-64">Unlock Vault</button>
                        <button onClick={onClose} className="text-slate-500 mt-4">Close</button>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-4 bg-slate-800 rounded-xl">
                    <button onClick={onClose} className="mb-4 text-cyan-400">← Back</button>
                    <h2 className="text-2xl font-bold mb-4">Class: {classCode} Analysis</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {Object.keys(analysis).map(name => {
                            const stats = analysis[name];
                            const total = stats.success + stats.fail;
                            const rate = total > 0 ? stats.success / total : 0;
                            let category = "You need to do more revision!";
                            if (rate >= 0.8) category = "Congrats, you have mastered the concepts";
                            else if (rate >= 0.5) category = "Almost there!";

                            return (
                                <div key={name} className="p-4 bg-slate-900 rounded border border-slate-700">
                                    <h4 className="font-bold text-white">{name}</h4>
                                    <p className={`text-xs mt-2 ${rate >= 0.8 ? 'text-emerald-400' : rate >= 0.5 ? 'text-orange-400' : 'text-red-400'}`}>{category}</p>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        const Home = ({ onStart, studentName, setStudentName, classCode, setClassCode }) => (
            <div className="space-y-4">
                <input className="w-full p-4 bg-slate-800 rounded-xl" placeholder="Name" value={studentName} onChange={e => setStudentName(e.target.value)} />
                <input className="w-full p-4 bg-slate-800 rounded-xl" placeholder="Class Code (e.g. 4A)" value={classCode} onChange={e => setClassCode(e.target.value.toUpperCase())} />
                <button onClick={onStart} className="w-full bg-cyan-600 py-4 rounded-xl font-bold" disabled={!studentName || !classCode}>INITIATE</button>
            </div>
        );

        const Dashboard = ({ completedModules, onSelect, progress }) => (
            <div className="grid grid-cols-2 gap-4">
                {['mod1', 'mod2', 'mod3', 'mod4'].map(id => (
                    <button key={id} onClick={() => onSelect(id)} className="bg-slate-800 p-8 rounded-xl border border-slate-700">
                        {completedModules[id] ? '✅ Done' : `Module ${id.slice(3)}`}
                    </button>
                ))}
            </div>
        );

        const Module1 = ({ onComplete, onBack, submitResponse }) => (<div className="space-y-4"><p>Module 1: Atmospheric Baseline. Enter 78, 21, 1.</p><button onClick={() => { submitResponse("Mod1", "SUCCESS"); onComplete(); }} className="bg-blue-600 px-4 py-2 rounded">Submit SUCCESS</button><button onClick={onBack}>Back</button></div>);
        const Module2 = ({ onComplete, onBack, submitResponse }) => (<div className="space-y-4"><p>Module 2: Case File Analysis</p><button onClick={() => { submitResponse("Mod2", "SUCCESS"); onComplete(); }} className="bg-orange-600 px-4 py-2 rounded">Submit SUCCESS</button><button onClick={onBack}>Back</button></div>);
        const Module3 = ({ onComplete, onBack, submitResponse }) => (<div className="space-y-4"><p>Module 3: Carbon Ledger</p><button onClick={() => { submitResponse("Mod3", "SUCCESS"); onComplete(); }} className="bg-emerald-600 px-4 py-2 rounded">Submit SUCCESS</button><button onClick={onBack}>Back</button></div>);
        const Module4 = ({ onComplete, onBack, submitResponse }) => (<div className="space-y-4"><p>Module 4: Climate Strategy</p><button onClick={() => { submitResponse("Mod4", "SUCCESS"); onComplete(); }} className="bg-red-600 px-4 py-2 rounded">Submit SUCCESS</button><button onClick={onBack}>Back</button></div>);

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

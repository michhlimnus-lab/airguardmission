<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirGuard: Air Quality Missions</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounceIn { 
            0% { opacity: 0; transform: scale(0.9); } 
            50% { opacity: 1; transform: scale(1.05); } 
            100% { transform: scale(1); } 
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-bounce-in { animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        body { background-color: #0f172a; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        // Custom Icon wrapper to ensure Lucide renders properly in Babel standalone
        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });
            return <i data-lucide={name} className={className}></i>;
        };

        // ======================================================
        // 🔥 YOUR FIREBASE CONFIG (The "Passport" to the Suite)
        // ======================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDRO8liDHigDRzV0jpHn3c4SmDlC-l3qLc",
            authDomain: "chem-detective-2026.firebaseapp.com",
            projectId: "chem-detective-2026",
            storageBucket: "chem-detective-2026.firebasestorage.app",
            messagingSenderId: "477655926627",
            appId: "1:477655926627:web:2a7d12a0163b54af5ab556"
        };

        const isLiveMode = !!firebaseConfig.apiKey;
        let app, auth, db;

        if (isLiveMode) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        const App = () => {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [studentName, setStudentName] = useState('');
            const [showTeacherView, setShowTeacherView] = useState(false);
            const [user, setUser] = useState(null);
            
            const [completedModules, setCompletedModules] = useState({
                mod1: false, mod2: false, mod3: false, mod4: false,
            });

            // Authenticate silently
            useEffect(() => {
                if (!isLiveMode) return;
                const initAuth = async () => {
                    try { await signInAnonymously(auth); } catch (e) { console.error("Auth error:", e); }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // The Telemetry Function (Saves to a new drawer: 'airGuardResponses')
            const submitResponse = async (moduleTitle, text) => {
                if (!studentName.trim() || !isLiveMode || !db) return;
                try {
                    await addDoc(collection(db, 'airGuardResponses'), {
                        studentName, 
                        phase: moduleTitle, 
                        text, 
                        timestamp: Date.now()
                    });
                } catch (e) { 
                    console.error("Submission failed: ", e); 
                }
            };

            const markCompleted = (mod) => {
                setCompletedModules(prev => ({ ...prev, [mod]: true }));
                setTimeout(() => setCurrentScreen('dashboard'), 1500);
            };

            const getProgress = () => Object.values(completedModules).filter(Boolean).length;

            if (showTeacherView) {
                return <TeacherDashboard onClose={() => setShowTeacherView(false)} user={user} />;
            }

            const renderScreen = () => {
                switch (currentScreen) {
                    case 'home': return <Home onStart={() => setCurrentScreen('dashboard')} studentName={studentName} setStudentName={setStudentName} />;
                    case 'dashboard': return <Dashboard completedModules={completedModules} onSelect={setCurrentScreen} progress={getProgress()} />;
                    case 'mod1': return <Module1 onComplete={() => markCompleted('mod1')} onBack={() => setCurrentScreen('dashboard')} />;
                    case 'mod2': return <Module2 onComplete={() => markCompleted('mod2')} onBack={() => setCurrentScreen('dashboard')} />;
                    case 'mod3': return <Module3 onComplete={() => markCompleted('mod3')} onBack={() => setCurrentScreen('dashboard')} />;
                    case 'mod4': return <Module4 onComplete={() => markCompleted('mod4')} onBack={() => setCurrentScreen('dashboard')} submitResponse={(t) => submitResponse("Module 4: Climate Strategy", t)} />;
                    default: return <Home onStart={() => setCurrentScreen('dashboard')} studentName={studentName} setStudentName={setStudentName} />;
                }
            };

            return (
                <div className="min-h-screen text-slate-100 font-sans selection:bg-cyan-500/30 p-4 md:p-6">
                    <div className="max-w-4xl mx-auto min-h-screen flex flex-col">
                        <header className="flex items-center justify-between py-4 border-b border-slate-700 mb-6">
                            <div className="flex items-center gap-3">
                                <div className="bg-cyan-500 p-2 rounded-lg text-slate-900">
                                    <Icon name="shield" className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-white tracking-wider">AIRGUARD</h1>
                                    <p className="text-xs text-cyan-400 font-mono">TASK FORCE INTERACTIVE</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <button onClick={() => setShowTeacherView(true)} className="text-slate-500 hover:text-cyan-400 transition-colors" title="Teacher Vault">
                                    <Icon name="eye" className="w-5 h-5" />
                                </button>
                                {currentScreen !== 'home' && (
                                    <div className="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                                        <Icon name="activity" className="w-4 h-4 text-emerald-400" />
                                        <span className="font-mono text-xs text-emerald-400 font-bold">Lvl {getProgress()}/4</span>
                                    </div>
                                )}
                            </div>
                        </header>
                        <main className="flex-grow">{renderScreen()}</main>
                        <footer className="mt-8 py-4 border-t border-slate-800 text-center text-xs text-slate-500">
                            Chapter 19: Maintaining Air Quality • Sec 4 G2 Science (Chemistry)
                        </footer>
                    </div>
                </div>
            );
        };

        const Home = ({ onStart, studentName, setStudentName }) => (
            <div className="flex flex-col items-center justify-center text-center space-y-8 mt-12 animate-fade-in">
                <div className="relative">
                    <div className="absolute inset-0 bg-cyan-500 blur-[100px] opacity-20 rounded-full"></div>
                    <Icon name="shield" className="w-32 h-32 text-cyan-400 relative z-10" />
                </div>
                <div className="max-w-xl space-y-4">
                    <h2 className="text-4xl font-extrabold text-white">Welcome, Recruit.</h2>
                    <p className="text-lg text-slate-300 leading-relaxed">
                        You've been assigned to the AirGuard Task Force. Your mission is to investigate air quality incidents, identify dangerous pollutants, balance the carbon cycle, and propose climate policies.
                    </p>
                    <p className="text-md text-cyan-400 font-medium">
                        We need critical thinkers. Are you ready?
                    </p>
                </div>
                
                <div className="w-full max-w-sm bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl backdrop-blur-sm">
                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Identify Yourself</label>
                    <input 
                        type="text" 
                        placeholder="Enter Cadet Name" 
                        value={studentName}
                        onChange={(e) => setStudentName(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-center text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all mb-4"
                    />
                    <button 
                        onClick={onStart} 
                        disabled={!studentName.trim()}
                        className={`w-full group relative px-8 py-4 font-bold rounded-xl transition-all flex items-center justify-center gap-2 ${studentName.trim() ? 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)]' : 'bg-slate-700 text-slate-500 cursor-not-allowed'}`}
                    >
                        INITIATE DASHBOARD <Icon name="arrow-right" className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                    </button>
                </div>
            </div>
        );

        const Dashboard = ({ completedModules, onSelect, progress }) => {
            const modules = [
                { id: 'mod1', title: 'Atmospheric Baseline', desc: 'Verify the normal composition of unpolluted air.', icon: 'wind', color: 'text-blue-400', bg: 'bg-blue-400/10', border: 'border-blue-400/30' },
                { id: 'mod2', title: 'The Pollutant Case Files', desc: 'Identify harmful gases, their sources, and their effects.', icon: 'factory', color: 'text-orange-400', bg: 'bg-orange-400/10', border: 'border-orange-400/30' },
                { id: 'mod3', title: 'Carbon Ledger', desc: 'Map the sinks and sources of the Carbon Cycle.', icon: 'leaf', color: 'text-emerald-400', bg: 'bg-emerald-400/10', border: 'border-emerald-400/30' },
                { id: 'mod4', title: 'Climate Strategy', desc: 'Analyze trade-offs in global warming mitigation.', icon: 'thermometer-sun', color: 'text-red-400', bg: 'bg-red-400/10', border: 'border-red-400/30' },
            ];

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-lg">
                        <h3 className="text-2xl font-bold mb-2 text-white">Mission Control</h3>
                        <p className="text-slate-400 mb-4">Complete all 4 operational modules to earn your AirGuard badge. Pay attention to the data; assumptions can be dangerous.</p>
                        <div className="w-full bg-slate-900 rounded-full h-4 mb-2 overflow-hidden border border-slate-700">
                            <div className="bg-gradient-to-r from-cyan-500 to-blue-500 h-4 rounded-full transition-all duration-1000" style={{ width: `${(progress / 4) * 100}%` }}></div>
                        </div>
                        <p className="text-right text-sm font-mono text-cyan-400 font-bold">{progress * 25}% Complete</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {modules.map((m) => {
                            const isDone = completedModules[m.id];
                            return (
                                <button key={m.id} onClick={() => onSelect(m.id)} className={`p-6 rounded-2xl border text-left transition-all relative overflow-hidden group ${isDone ? 'border-slate-600 bg-slate-800/50 opacity-70' : `hover:bg-slate-800 hover:-translate-y-1 ${m.bg} ${m.border}`}`}>
                                    {isDone && <div className="absolute inset-0 bg-emerald-500/5 z-0"></div>}
                                    <div className="flex items-start justify-between relative z-10">
                                        <div className="flex gap-4">
                                            <div className={`p-3 rounded-lg bg-slate-900 shadow-inner ${m.color}`}>
                                                <Icon name={m.icon} className="w-6 h-6" />
                                            </div>
                                            <div>
                                                <h4 className={`text-xl font-bold ${isDone ? 'text-slate-300' : 'text-white'} flex items-center gap-2`}>
                                                    {m.title}
                                                </h4>
                                                <p className="text-sm text-slate-400 mt-1">{m.desc}</p>
                                            </div>
                                        </div>
                                        {isDone && <Icon name="check-circle" className="w-6 h-6 text-emerald-500 flex-shrink-0" />}
                                    </div>
                                </button>
                            );
                        })}
                    </div>

                    {progress === 4 && (
                        <div className="mt-8 p-6 bg-gradient-to-br from-emerald-900/40 to-cyan-900/40 border border-emerald-500/30 rounded-2xl text-center animate-bounce-in shadow-2xl">
                            <div className="inline-block p-4 bg-emerald-500/20 rounded-full mb-4">
                                <Icon name="award" className="w-12 h-12 text-emerald-400" />
                            </div>
                            <h3 className="text-2xl font-bold text-white mb-2">AirGuard Certification Achieved!</h3>
                            <p className="text-emerald-200">Excellent work. You've demonstrated a strong understanding of air quality and the critical thinking needed to protect our environment.</p>
                        </div>
                    )}
                </div>
            );
        };

        const Module1 = ({ onComplete, onBack }) => {
            const [values, setValues] = useState({ nitrogen: '', oxygen: '', others: '' });
            const [error, setError] = useState('');
            const [success, setSuccess] = useState(false);

            const checkValues = () => {
                const n = parseInt(values.nitrogen);
                const o = parseInt(values.oxygen);
                const ot = parseInt(values.others);

                if (n === 78 && o === 21 && ot === 1) {
                    setSuccess(true);
                    setError('');
                    onComplete();
                } else if (n + o + ot !== 100) {
                    setError("The percentages must add up to 100%.");
                } else {
                    setError("Incorrect proportions. Think about the most abundant gas first.");
                }
            };

            return (
                <div className="space-y-6 animate-fade-in max-w-2xl mx-auto">
                    <button onClick={onBack} className="text-cyan-400 hover:text-cyan-300 flex items-center gap-1 text-sm font-medium transition-colors">
                        <Icon name="arrow-left" className="w-4 h-4" /> Back to Control
                    </button>
                    
                    <div className="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-xl">
                        <h2 className="text-2xl font-bold mb-4 flex items-center gap-3 text-white">
                            <div className="p-2 bg-blue-500/20 rounded-lg"><Icon name="wind" className="text-blue-400 w-6 h-6" /></div>
                            Module 1: Atmospheric Baseline
                        </h2>
                        <p className="text-slate-300 mb-6 bg-slate-900 p-5 rounded-xl border border-slate-700 border-l-4 border-l-blue-500 shadow-inner">
                            "Recruit, before we detect anomalies (pollution), we must know the baseline. Calibrate the atmospheric sensors to reflect the composition of clean, dry air."
                        </p>

                        <div className="space-y-4">
                            <div className="flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-700 focus-within:border-blue-500 transition-colors">
                                <label className="font-medium text-slate-200">Nitrogen (N₂)</label>
                                <div className="flex items-center gap-2">
                                    <input type="number" min="0" max="100" className="w-20 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-center text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" 
                                        value={values.nitrogen} onChange={e => setValues({...values, nitrogen: e.target.value})} />
                                    <span className="text-slate-400 font-bold">%</span>
                                </div>
                            </div>

                            <div className="flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-700 focus-within:border-blue-500 transition-colors">
                                <label className="font-medium text-slate-200">Oxygen (O₂)</label>
                                <div className="flex items-center gap-2">
                                    <input type="number" min="0" max="100" className="w-20 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-center text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" 
                                        value={values.oxygen} onChange={e => setValues({...values, oxygen: e.target.value})} />
                                    <span className="text-slate-400 font-bold">%</span>
                                </div>
                            </div>

                            <div className="flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-700 focus-within:border-blue-500 transition-colors">
                                <div>
                                    <label className="font-medium text-slate-200 block">Noble Gases, CO₂ & Water Vapour</label>
                                    <span className="text-xs text-slate-500">The "Others" category</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <input type="number" min="0" max="100" className="w-20 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-center text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all" 
                                        value={values.others} onChange={e => setValues({...values, others: e.target.value})} />
                                    <span className="text-slate-400 font-bold">%</span>
                                </div>
                            </div>
                        </div>

                        {error && <p className="text-red-400 text-sm mt-4 flex items-center gap-2 bg-red-500/10 p-3 rounded-lg border border-red-500/20"><Icon name="alert-triangle" className="w-4 h-4 flex-shrink-0" /> {error}</p>}
                        {success && <p className="text-emerald-400 font-bold mt-4 flex items-center gap-2 bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20"><Icon name="check-circle" className="w-5 h-5 flex-shrink-0" /> Sensors calibrated! Logging result...</p>}

                        <button onClick={checkValues} disabled={success} className="w-full mt-6 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:scale-100 flex items-center justify-center gap-2">
                            {success ? <><Icon name="check" className="w-5 h-5" /> CALIBRATED</> : 'CALIBRATE SENSORS'}
                        </button>
                    </div>

                    <div className="bg-slate-800/50 p-5 rounded-xl border border-slate-700/50 shadow-sm">
                        <h4 className="text-sm font-bold text-cyan-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                            <Icon name="help-circle" className="w-4 h-4" /> Field Question
                        </h4>
                        <p className="text-sm text-slate-300 italic leading-relaxed">
                            "If a fire blanket is thrown over a burning beaker in the lab, which gas from your baseline are we trying to eliminate from the equation to stop the combustion?"
                        </p>
                    </div>
                </div>
            );
        };

        const Module2 = ({ onComplete, onBack }) => {
            const [currentCase, setCurrentCase] = useState(0);
            const [success, setSuccess] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const cases = [
                {
                    title: "Case File #001: The Choking City",
                    scenario: "Hospitals report a spike in patients with severe breathing difficulties. Residents complain of a foul smell, and ancient limestone statues in the city square are dissolving.",
                    clue: "Analysis of the air shows high levels of a gas produced from burning coal containing impurities.",
                    options: ["Carbon Monoxide (CO)", "Sulfur Dioxide (SO₂)", "Methane (CH₄)"],
                    answer: "Sulfur Dioxide (SO₂)",
                    explanation: "Correct. SO₂ comes from burning sulfur-containing fossil fuels (like coal). It irritates eyes/lungs and dissolves in rain to form acid rain, which corrodes limestone buildings."
                },
                {
                    title: "Case File #002: The Silent Garage",
                    scenario: "A person is found unconscious in a closed garage with a car engine left running. There was no smoke and no smell.",
                    clue: "Blood tests show the haemoglobin in the victim's blood is unable to transport oxygen.",
                    options: ["Nitrogen Dioxide (NO₂)", "Ozone (O₃)", "Carbon Monoxide (CO)"],
                    answer: "Carbon Monoxide (CO)",
                    explanation: "Correct. CO is colourless and odourless. Produced by the incomplete combustion of petrol, it binds strongly to haemoglobin, starving the body of oxygen."
                },
                {
                    title: "Case File #003: The Lightning Storm",
                    scenario: "Following a massive thunderstorm, monitoring stations detect an unusual reddish-brown gas in the atmosphere.",
                    clue: "The high temperatures of lightning strikes caused two unreactive baseline gases to combine.",
                    options: ["Unburnt Hydrocarbons", "Oxides of Nitrogen (NOx)", "Carbon Dioxide (CO₂)"],
                    answer: "Oxides of Nitrogen (NOx)",
                    explanation: "Correct! The extreme heat of lightning (or car engines) provides enough energy for Nitrogen and Oxygen to react, forming NOx, which also causes acid rain."
                }
            ];

            const handleGuess = (guess) => {
                if (guess === cases[currentCase].answer) {
                    setFeedback({ type: 'success', text: cases[currentCase].explanation });
                    setTimeout(() => {
                        setFeedback(null);
                        if (currentCase < cases.length - 1) {
                            setCurrentCase(c => c + 1);
                        } else {
                            setSuccess(true);
                            onComplete();
                        }
                    }, 5000);
                } else {
                    setFeedback({ type: 'error', text: "Incorrect. Re-read the clues carefully. Think about the sources." });
                }
            };

            return (
                <div className="space-y-6 animate-fade-in max-w-2xl mx-auto">
                    <button onClick={onBack} className="text-cyan-400 hover:text-cyan-300 flex items-center gap-1 text-sm font-medium transition-colors">
                        <Icon name="arrow-left" className="w-4 h-4" /> Back to Control
                    </button>

                    <div className="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-xl relative overflow-hidden">
                        {success ? (
                            <div className="text-center py-12 space-y-4 animate-bounce-in">
                                <div className="inline-block p-4 bg-emerald-500/20 rounded-full mb-2">
                                    <Icon name="check-circle" className="w-16 h-16 text-emerald-500 mx-auto" />
                                </div>
                                <h2 className="text-2xl font-bold text-white">All Cases Closed</h2>
                                <p className="text-slate-300">Excellent deductive reasoning, Detective.</p>
                            </div>
                        ) : (
                            <>
                                <div className="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                                    <h2 className="text-xl md:text-2xl font-bold flex items-center gap-3 text-white">
                                        <div className="p-2 bg-orange-500/20 rounded-lg"><Icon name="factory" className="text-orange-400 w-6 h-6" /></div> 
                                        {cases[currentCase].title}
                                    </h2>
                                    <span className="text-xs font-bold font-mono bg-slate-900 text-slate-400 px-3 py-1.5 rounded-full border border-slate-700 shadow-inner tracking-widest uppercase">
                                        File {currentCase + 1}/{cases.length}
                                    </span>
                                </div>

                                <div className="space-y-4 mb-8">
                                    <div className="bg-slate-900/80 p-5 rounded-xl border border-slate-700 shadow-inner">
                                        <h4 className="text-xs uppercase text-slate-500 font-bold mb-2 tracking-wider flex items-center gap-2"><Icon name="file-text" className="w-4 h-4" /> Scenario</h4>
                                        <p className="text-slate-200 leading-relaxed">{cases[currentCase].scenario}</p>
                                    </div>
                                    <div className="bg-orange-900/20 border border-orange-500/30 p-5 rounded-xl flex items-start gap-3 shadow-inner">
                                        <Icon name="search" className="w-5 h-5 text-orange-400 flex-shrink-0 mt-0.5" />
                                        <div>
                                            <h4 className="text-xs uppercase text-orange-400 font-bold mb-1 tracking-wider">Forensic Clue</h4>
                                            <p className="text-orange-100 leading-relaxed">{cases[currentCase].clue}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid gap-3">
                                    <p className="text-sm font-bold text-slate-400 mb-2 uppercase tracking-wider">Identify the culprit:</p>
                                    {cases[currentCase].options.map((opt, i) => (
                                        <button
                                            key={i}
                                            onClick={() => handleGuess(opt)}
                                            disabled={feedback?.type === 'success'}
                                            className="p-4 text-left font-medium text-slate-200 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-xl transition-all shadow-sm hover:shadow-md disabled:opacity-50 disabled:hover:bg-slate-700 flex justify-between items-center group"
                                        >
                                            {opt}
                                            <Icon name="chevron-right" className="w-4 h-4 opacity-0 group-hover:opacity-100 text-slate-400 transition-opacity" />
                                        </button>
                                    ))}
                                </div>

                                {feedback && (
                                    <div className={`mt-6 p-5 rounded-xl flex items-start gap-3 animate-fade-in shadow-inner ${feedback.type === 'success' ? 'bg-emerald-900/30 border border-emerald-500/50' : 'bg-red-900/30 border border-red-500/50'}`}>
                                        {feedback.type === 'success' ? <Icon name="check-circle" className="w-5 h-5 text-emerald-400 flex-shrink-0 mt-0.5" /> : <Icon name="alert-triangle" className="w-5 h-5 text-red-400 flex-shrink-0 mt-0.5" />}
                                        <p className={`leading-relaxed ${feedback.type === 'success' ? 'text-emerald-100' : 'text-red-100'}`}>{feedback.text}</p>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const Module3 = ({ onComplete, onBack }) => {
            const [items, setItems] = useState([
                { id: 1, name: 'Photosynthesis', category: null },
                { id: 2, name: 'Respiration', category: null },
                { id: 3, name: 'Combustion of Fossil Fuels', category: null },
                { id: 4, name: 'Decomposition', category: null },
                { id: 5, name: 'Ocean Absorption', category: null }
            ]);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState(false);

            const categories = {
                source: "Adds CO₂ to Air",
                sink: "Removes CO₂ from Air"
            };

            const answers = { 1: 'sink', 2: 'source', 3: 'source', 4: 'source', 5: 'sink' };

            const handleSelect = (itemId, category) => {
                setItems(items.map(item => item.id === itemId ? { ...item, category } : item));
                setError('');
            };

            const verifyAnswers = () => {
                const unassigned = items.find(i => i.category === null);
                if (unassigned) {
                    setError("Please classify all processes.");
                    return;
                }

                const wrongItems = items.filter(item => item.category !== answers[item.id]);

                if (wrongItems.length === 0) {
                    setSuccess(true);
                    setError('');
                    onComplete();
                } else {
                    const wrongNames = wrongItems.map(i => i.name).join(', ');
                    setError(`Atmospheric balance error. Review your classification for: ${wrongNames}.`);
                }
            };

            return (
                <div className="space-y-6 animate-fade-in max-w-3xl mx-auto">
                    <button onClick={onBack} className="text-cyan-400 hover:text-cyan-300 flex items-center gap-1 text-sm font-medium transition-colors">
                        <Icon name="arrow-left" className="w-4 h-4" /> Back to Control
                    </button>

                    <div className="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-xl">
                        <h2 className="text-2xl font-bold mb-3 flex items-center gap-3 text-white">
                            <div className="p-2 bg-emerald-500/20 rounded-lg"><Icon name="leaf" className="text-emerald-400 w-6 h-6" /></div>
                            Module 3: The Carbon Ledger
                        </h2>
                        <p className="text-slate-300 mb-8 leading-relaxed">
                            The Carbon Cycle regulates global temperatures. You must balance the ledger by categorizing these processes. Do they act as a <span className="text-red-400 font-bold">Source</span> or a <span className="text-emerald-400 font-bold">Sink</span>?
                        </p>

                        <div className="grid md:grid-cols-2 gap-6 mb-8">
                            <div className="bg-red-900/10 border border-red-500/30 rounded-xl p-5 min-h-[280px] shadow-inner flex flex-col">
                                <h3 className="text-center font-bold text-red-400 mb-4 flex items-center justify-center gap-2 pb-3 border-b border-red-500/20 uppercase tracking-widest text-sm">
                                    <Icon name="arrow-up-right" className="w-5 h-5" /> {categories.source}
                                </h3>
                                <div className="space-y-3 flex-grow">
                                    {items.filter(i => i.category === 'source').map(item => (
                                        <div key={item.id} onClick={() => handleSelect(item.id, null)} className="bg-slate-700/80 p-3 rounded-lg text-sm font-medium cursor-pointer hover:bg-slate-600 border border-red-400/40 text-center transition-colors shadow-sm flex items-center justify-between group">
                                            <span>{item.name}</span>
                                            <Icon name="x" className="w-4 h-4 text-slate-400 group-hover:text-red-300 transition-colors" />
                                        </div>
                                    ))}
                                    {items.filter(i => i.category === 'source').length === 0 && <div className="h-full flex items-center justify-center text-slate-500 text-sm italic opacity-50">Empty</div>}
                                </div>
                            </div>

                            <div className="bg-emerald-900/10 border border-emerald-500/30 rounded-xl p-5 min-h-[280px] shadow-inner flex flex-col">
                                <h3 className="text-center font-bold text-emerald-400 mb-4 flex items-center justify-center gap-2 pb-3 border-b border-emerald-500/20 uppercase tracking-widest text-sm">
                                    <Icon name="arrow-down-right" className="w-5 h-5" /> {categories.sink}
                                </h3>
                                <div className="space-y-3 flex-grow">
                                    {items.filter(i => i.category === 'sink').map(item => (
                                        <div key={item.id} onClick={() => handleSelect(item.id, null)} className="bg-slate-700/80 p-3 rounded-lg text-sm font-medium cursor-pointer hover:bg-slate-600 border border-emerald-400/40 text-center transition-colors shadow-sm flex items-center justify-between group">
                                            <span>{item.name}</span>
                                            <Icon name="x" className="w-4 h-4 text-slate-400 group-hover:text-emerald-300 transition-colors" />
                                        </div>
                                    ))}
                                    {items.filter(i => i.category === 'sink').length === 0 && <div className="h-full flex items-center justify-center text-slate-500 text-sm italic opacity-50">Empty</div>}
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-900 p-5 rounded-xl border border-slate-700 mb-8 shadow-inner">
                            <p className="text-xs uppercase text-slate-400 font-bold mb-4 tracking-widest flex items-center gap-2"><Icon name="list" className="w-4 h-4" /> Unclassified Processes</p>
                            <div className="flex flex-wrap gap-3">
                                {items.filter(i => i.category === null).map(item => (
                                    <div key={item.id} className="flex bg-slate-800 rounded-lg overflow-hidden border border-slate-600 shadow-sm transition-transform hover:-translate-y-0.5">
                                        <span className="p-3 text-sm font-medium text-slate-200 px-4">{item.name}</span>
                                        <button onClick={() => handleSelect(item.id, 'source')} className="px-4 bg-red-900/40 hover:bg-red-800/80 text-red-300 text-xs font-bold border-l border-slate-600 transition-colors flex items-center gap-1" title="Add to Source"><Icon name="plus" className="w-3 h-3"/> SRC</button>
                                        <button onClick={() => handleSelect(item.id, 'sink')} className="px-4 bg-emerald-900/40 hover:bg-emerald-800/80 text-emerald-300 text-xs font-bold border-l border-slate-600 transition-colors flex items-center gap-1" title="Add to Sink"><Icon name="plus" className="w-3 h-3"/> SNK</button>
                                    </div>
                                ))}
                                {items.filter(i => i.category === null).length === 0 && <span className="text-sm text-emerald-500/70 font-medium italic flex items-center gap-2"><Icon name="check" className="w-4 h-4" /> All processes classified. Verify your ledger below.</span>}
                            </div>
                        </div>

                        {error && <p className="text-red-400 text-sm mb-5 flex items-center gap-2 bg-red-500/10 p-3 rounded-lg border border-red-500/20"><Icon name="alert-triangle" className="w-4 h-4 flex-shrink-0" /> {error}</p>}
                        {success && <p className="text-emerald-400 font-bold mb-5 flex items-center gap-2 bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20"><Icon name="check-circle" className="w-5 h-5 flex-shrink-0" /> Ledger balanced perfectly!</p>}

                        <button onClick={verifyAnswers} disabled={success} className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:scale-100 flex items-center justify-center gap-2">
                            {success ? <><Icon name="check" className="w-5 h-5" /> VERIFIED</> : 'VERIFY CARBON LEDGER'}
                        </button>
                    </div>
                </div>
            );
        };

        const Module4 = ({ onComplete, onBack, submitResponse }) => {
            const [selectedAns, setSelectedAns] = useState(null);
            const [showFeedback, setShowFeedback] = useState(false);

            const scenario = {
                title: "The Electric Paradox",
                text: "The Mayor of the city announces a bold plan to combat Global Warming: 'We will ban all petrol cars and replace them with 1,000,000 Electric Vehicles (EVs). EVs have no exhaust pipes, so they produce zero air pollutants and zero greenhouse gases. This will completely solve our climate crisis!'",
                question: "As the Chief Air Quality Officer, analyze the Mayor's statement. Is the Mayor entirely correct?",
                options: [
                    { id: 'a', text: "Yes. Since EVs do not burn petrol, they do not release Carbon Dioxide or pollutants into the atmosphere at all." },
                    { id: 'b', text: "No. EVs don't have exhausts, but if the electricity used to charge them comes from coal-fired power plants, we are just moving the emissions from the cars to the power plant." },
                    { id: 'c', text: "No. EVs actually release Methane from their batteries, which is a worse greenhouse gas than Carbon Dioxide." }
                ],
                correct: 'b'
            };

            const handleSubmit = () => {
                setShowFeedback(true);
                
                // 🔥 Telemetry: Fire the response to the Boss Cat Vault
                const chosenText = scenario.options.find(o => o.id === selectedAns).text;
                submitResponse(`Selected Option [${selectedAns.toUpperCase()}]: ${chosenText}`);

                if (selectedAns === scenario.correct) {
                    setTimeout(() => onComplete(), 5000);
                }
            };

            return (
                <div className="space-y-6 animate-fade-in max-w-2xl mx-auto">
                    <button onClick={onBack} className="text-cyan-400 hover:text-cyan-300 flex items-center gap-1 text-sm font-medium transition-colors">
                        <Icon name="arrow-left" className="w-4 h-4" /> Back to Control
                    </button>

                    <div className="bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-xl">
                        <h2 className="text-2xl font-bold mb-6 flex items-center gap-3 text-white">
                            <div className="p-2 bg-red-500/20 rounded-lg"><Icon name="thermometer-sun" className="text-red-400 w-6 h-6" /></div>
                            Module 4: Climate Strategy
                        </h2>
                        
                        <div className="bg-slate-900 border border-red-500/30 p-6 rounded-xl mb-8 shadow-inner">
                            <h3 className="text-lg font-bold text-slate-200 mb-3 flex items-center gap-2"><Icon name="file-text" className="w-5 h-5 text-slate-400"/> {scenario.title}</h3>
                            <p className="text-slate-300 leading-relaxed italic border-l-4 border-l-red-500/50 bg-slate-800/50 p-4 rounded-r-lg mb-5">
                                "{scenario.text}"
                            </p>
                            <p className="font-bold text-cyan-300 flex items-start gap-2 bg-cyan-900/20 p-4 rounded-lg border border-cyan-500/20">
                                <Icon name="help-circle" className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                {scenario.question}
                            </p>
                        </div>

                        <div className="space-y-4">
                            <p className="text-xs uppercase text-slate-400 font-bold tracking-widest pl-1">Select your policy analysis:</p>
                            {scenario.options.map(opt => (
                                <button
                                    key={opt.id}
                                    onClick={() => { setSelectedAns(opt.id); setShowFeedback(false); }}
                                    disabled={showFeedback && selectedAns === scenario.correct}
                                    className={`w-full text-left p-5 rounded-xl border transition-all ${
                                        selectedAns === opt.id 
                                            ? 'bg-blue-900/50 border-blue-400 text-white shadow-[0_0_15px_rgba(96,165,250,0.2)] scale-[1.01]' 
                                            : 'bg-slate-700/50 border-slate-600 text-slate-300 hover:bg-slate-700 hover:border-slate-500'
                                    }`}
                                >
                                    <div className="flex gap-4">
                                        <span className={`font-bold text-lg mt-[-2px] ${selectedAns === opt.id ? 'text-blue-300' : 'text-slate-500'}`}>{opt.id.toUpperCase()}.</span>
                                        <span className="leading-relaxed">{opt.text}</span>
                                    </div>
                                </button>
                            ))}
                        </div>

                        {showFeedback && (
                            <div className={`mt-8 p-6 rounded-xl animate-fade-in shadow-inner ${
                                selectedAns === scenario.correct 
                                ? 'bg-emerald-900/30 border border-emerald-500/50 text-emerald-100' 
                                : 'bg-red-900/30 border border-red-500/50 text-red-100'
                            }`}>
                                {selectedAns === scenario.correct ? (
                                    <>
                                        <h4 className="font-bold text-lg flex items-center gap-2 mb-3 text-emerald-300"><Icon name="check-circle" className="w-6 h-6" /> Excellent Critical Thinking.</h4>
                                        <p className="text-sm leading-relaxed text-emerald-100/90">
                                            You spotted the hidden variables. To truly reduce greenhouse gases, transitioning to EVs must be paired with transitioning the energy grid to renewable sources (like solar or wind) rather than burning fossil fuels.
                                        </p>
                                    </>
                                ) : (
                                    <>
                                        <h4 className="font-bold text-lg flex items-center gap-2 mb-3 text-red-300"><Icon name="alert-triangle" className="w-6 h-6" /> Incomplete Analysis.</h4>
                                        <p className="text-sm leading-relaxed text-red-100/90">
                                            Think deeply about the whole system. Where does the electricity to charge an electric car come from in most countries today? Try again.
                                        </p>
                                    </>
                                )}
                            </div>
                        )}

                        <button 
                            onClick={handleSubmit}
                            disabled={!selectedAns || (showFeedback && selectedAns === scenario.correct)}
                            className="w-full mt-8 py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:scale-100 flex items-center justify-center gap-2 uppercase tracking-wide"
                        >
                            {showFeedback && selectedAns === scenario.correct ? <><Icon name="radio" className="w-5 h-5 animate-pulse" /> LOGGING POLICY...</> : 'SUBMIT ANALYSIS'}
                        </button>
                    </div>
                </div>
            );
        };

        // --- NEW COMPONENT: THE TEACHER VAULT ---
        function TeacherDashboard({ onClose, user }) {
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [pin, setPin] = useState("");
            const [pinError, setPinError] = useState(false);
            const [res, setRes] = useState([]);
            const [copied, setCopied] = useState(false);
            const [showConfirm, setShowConfirm] = useState(false);
            const [isClearing, setIsClearing] = useState(false);
            
            useEffect(() => {
                if (!isLiveMode || !user || !isUnlocked) return;
                // Looking into the new 'airGuardResponses' drawer
                return onSnapshot(collection(db, 'airGuardResponses'), s => {
                    const data = s.docs.map(d => ({id: d.id, ...d.data()}));
                    setRes(data.sort((a,b) => b.timestamp - a.timestamp));
                });
            }, [user, isUnlocked]);

            const handleUnlock = () => {
                // The secret salary PIN remains 8600
                if (pin === "8600") {
                    setIsUnlocked(true);
                    setPinError(false);
                } else {
                    setPinError(true);
                    setPin("");
                }
            };

            const executeClearAll = async () => {
                if (!db) return;
                setIsClearing(true);
                try {
                    const deletePromises = res.map(r => deleteDoc(doc(db, 'airGuardResponses', r.id)));
                    await Promise.all(deletePromises);
                    setShowConfirm(false);
                } catch (e) {
                    console.error("Error clearing dashboard: ", e);
                } finally {
                    setIsClearing(false);
                }
            };

            const copyToClipboard = () => {
                const textToCopy = res.map(r => `Cadet: ${r.studentName}\nPhase: ${r.phase}\nAnalysis: ${r.text}\nTime: ${new Date(r.timestamp).toLocaleTimeString()}\n-------------------`).join('\n\n');
                navigator.clipboard.writeText(textToCopy).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            };

            if (!isUnlocked) {
                return (
                    <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4 font-sans relative overflow-hidden">
                        <button onClick={onClose} className="absolute top-8 right-8 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-full transition-colors"><Icon name="x" className="w-6 h-6"/></button>
                        <div className="bg-slate-800 p-10 rounded-3xl border border-slate-700 max-w-sm w-full text-center shadow-2xl animate-fade-in relative z-10">
                            <div className="w-20 h-20 bg-cyan-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                                <Icon name="lock" className="w-10 h-10 text-cyan-400" />
                            </div>
                            <h2 className="text-2xl font-bold mb-2">Teacher Vault</h2>
                            <p className="text-slate-400 text-sm mb-8">Enter your secure PIN to access live telemetry.</p>
                            
                            <input 
                                type="password" 
                                value={pin} 
                                onChange={e => {setPin(e.target.value); setPinError(false);}} 
                                onKeyDown={e => e.key === 'Enter' && handleUnlock()}
                                placeholder="Enter PIN" 
                                className={`w-full bg-slate-900 border ${pinError ? 'border-rose-500' : 'border-slate-600'} rounded-xl p-4 text-center text-xl tracking-widest focus:ring-2 focus:ring-cyan-500 outline-none mb-2 text-white transition-colors`}
                            />
                            {pinError && <p className="text-rose-500 text-sm mb-4 animate-pulse">Incorrect PIN. Nice try!</p>}
                            {!pinError && <div className="mb-6"></div>}

                            <button 
                                onClick={handleUnlock} 
                                className="w-full bg-cyan-600 hover:bg-cyan-700 font-bold py-4 rounded-xl transition-all shadow-lg shadow-cyan-500/20"
                            >
                                Unlock Dashboard
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8 font-sans relative">
                    {/* Custom Confirmation Modal */}
                    {showConfirm && (
                        <div className="fixed inset-0 bg-slate-900/95 z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-rose-500/50 p-8 rounded-3xl max-w-md w-full text-center shadow-2xl animate-fade-in">
                                <div className="inline-block p-4 bg-rose-500/10 rounded-full mb-4">
                                    <Icon name="trash-2" className="w-12 h-12 text-rose-500" />
                                </div>
                                <h3 className="text-2xl font-bold mb-2">Nuke all telemetry?</h3>
                                <p className="text-slate-400 mb-8">This will permanently delete all student submissions. This action cannot be undone.</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowConfirm(false)} className="flex-1 bg-slate-700 hover:bg-slate-600 font-bold py-3 rounded-xl transition-colors">Cancel</button>
                                    <button onClick={executeClearAll} disabled={isClearing} className="flex-1 bg-rose-600 hover:bg-rose-700 font-bold py-3 rounded-xl transition-colors flex justify-center items-center gap-2">
                                        {isClearing ? <Icon name="refresh-cw" className="w-5 h-5 animate-spin" /> : "Yes, Delete All"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="max-w-6xl mx-auto">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-700 pb-6 gap-4">
                            <div>
                                <h1 className="text-3xl font-bold flex items-center gap-3 text-cyan-400">
                                    <Icon name="radio" className="w-8 h-8"/> Live Telemetry Feed
                                </h1>
                                <p className="text-sm text-slate-400 mt-2 font-mono">DATABASE: airGuardResponses</p>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={copyToClipboard}
                                    className="flex items-center gap-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition-colors border border-slate-600 font-medium text-sm"
                                >
                                    {copied ? <Icon name="check-circle" className="w-4 h-4 text-emerald-400" /> : <Icon name="copy" className="w-4 h-4" />}
                                    {copied ? "Copied!" : "Copy Feed"}
                                </button>
                                <button onClick={() => setShowConfirm(true)} className="bg-rose-900/30 hover:bg-rose-900/50 transition-colors text-rose-300 border border-rose-700/50 px-4 py-2.5 rounded-lg font-medium text-sm flex items-center gap-2">
                                    <Icon name="trash-2" className="w-4 h-4" /> Clear Data
                                </button>
                                <button onClick={onClose} className="bg-cyan-600 hover:bg-cyan-700 transition-colors px-6 py-2.5 rounded-lg font-bold shadow-md flex items-center gap-2 text-sm ml-2">
                                    <Icon name="x" className="w-4 h-4" /> Close Vault
                                </button>
                            </div>
                        </div>
                        
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {res.map(r => (
                                <div key={r.id} className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg relative overflow-hidden group hover:border-cyan-500/50 transition-colors">
                                    <div className="absolute top-0 left-0 w-1.5 h-full bg-cyan-500"></div>
                                    <div className="flex justify-between items-start mb-3">
                                        <strong className="text-xl text-white font-bold">{r.studentName}</strong>
                                        <span className="text-[10px] font-mono text-slate-400 bg-slate-900 px-2 py-1 rounded border border-slate-700">{new Date(r.timestamp).toLocaleTimeString()}</span>
                                    </div>
                                    <span className="inline-flex items-center gap-1.5 px-3 py-1 bg-cyan-900/30 text-cyan-300 text-[10px] font-bold rounded-full mb-4 uppercase tracking-wider border border-cyan-500/20">
                                        <Icon name="target" className="w-3 h-3" /> {r.phase}
                                    </span>
                                    <p className="mt-2 text-slate-300 text-sm border-l-2 border-slate-600 pl-4 leading-relaxed">"{r.text}"</p>
                                </div>
                            ))}
                            {res.length === 0 && (
                                <div className="col-span-full py-32 text-center text-slate-500 flex flex-col items-center gap-4 bg-slate-800/30 rounded-2xl border border-slate-700/50 border-dashed">
                                    <Icon name="radio" className="w-12 h-12 text-slate-600 animate-pulse" />
                                    <p className="text-lg font-medium">Vault active. Waiting for cadet transmissions...</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
